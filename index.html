<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaia Mapper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="toolbar">
    <div class="toolbar-group">
      <span class="app-title">Gaia Mapper</span>
      <select id="scene-selector" disabled>
        <option value="">Loading payload...</option>
      </select>
    </div>
    <div class="toolbar-group" style="position:relative">
      <button id="btn-layer" class="mode-btn dropdown-trigger" title="Scene assets">Layer 1 &#x25BE;</button>
      <div id="asset-dropdown" class="asset-dropdown"></div>
      <button id="btn-grid" class="mode-btn" title="Toggle grid overlay">Grid</button>
      <button id="btn-block-view" class="mode-btn" title="Show block collision overlay"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="5" rx=".5" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="1" y="8" width="12" height="5" rx=".5" fill="none" stroke="currentColor" stroke-width="1.1"/><line x1="7" y1="1" x2="7" y2="6" stroke="currentColor" stroke-width="1"/><line x1="4" y1="8" x2="4" y2="13" stroke="currentColor" stroke-width="1"/><line x1="10" y1="8" x2="10" y2="13" stroke="currentColor" stroke-width="1"/></svg></button>
      <button id="btn-pattern" class="mode-btn" title="Pattern stamp mode (right-drag to select)"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1.5" y="1.5" width="11" height="8" rx=".5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.5 1.5"/><path d="M9 10.5l2 2.5M11 10.5l-2 2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <span class="dropdown-wrap">
        <button id="btn-resize" class="mode-btn" title="Resize tilemap"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="3" width="6" height="6" rx=".5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1"/><rect x="5" y="1" width="8" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <div id="resize-dropdown" class="resize-dropdown">
          <div class="resize-field">
            <label for="resize-width">Width</label>
            <input type="number" id="resize-width" min="1" max="32" value="2">
          </div>
          <div class="resize-field">
            <label for="resize-height">Height</label>
            <input type="number" id="resize-height" min="1" max="32" value="2">
          </div>
          <div class="resize-field">
            <label>Anchor</label>
            <div id="resize-anchor" class="anchor-grid">
              <button type="button" class="anchor-cell" data-anchor="top-left" title="Top Left"></button>
              <button type="button" class="anchor-cell" data-anchor="top-center" title="Top Center"></button>
              <button type="button" class="anchor-cell active" data-anchor="top-right" title="Top Right"></button>
              <button type="button" class="anchor-cell" data-anchor="middle-left" title="Middle Left"></button>
              <button type="button" class="anchor-cell" data-anchor="middle-center" title="Center"></button>
              <button type="button" class="anchor-cell" data-anchor="middle-right" title="Middle Right"></button>
              <button type="button" class="anchor-cell" data-anchor="bottom-left" title="Bottom Left"></button>
              <button type="button" class="anchor-cell" data-anchor="bottom-center" title="Bottom Center"></button>
              <button type="button" class="anchor-cell" data-anchor="bottom-right" title="Bottom Right"></button>
            </div>
          </div>
          <div class="resize-info" id="resize-info"></div>
          <div class="resize-actions">
            <button type="button" id="resize-cancel" class="resize-btn">Cancel</button>
            <button type="button" id="resize-confirm" class="resize-btn primary">Resize</button>
          </div>
        </div>
      </span>
      <span class="dropdown-wrap">
        <button id="btn-nudge" class="mode-btn" title="Nudge tilemap"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1l2.5 3H8v3h3V5.5L14 8l-3 2.5V9H8v3h1.5L7 14l-2.5-2H6V9H3v1.5L0 8l3-2.5V7h3V4H4.5z" fill="currentColor"/></svg></button>
        <div id="nudge-dropdown" class="nudge-dropdown">
          <div class="nudge-pad">
            <button type="button" class="nudge-arrow nudge-up" data-dir="up" title="Nudge up">&#x25B2;</button>
            <button type="button" class="nudge-arrow nudge-left" data-dir="left" title="Nudge left">&#x25C0;</button>
            <input type="number" id="nudge-amount" class="nudge-amount" min="1" max="255" value="1" title="Amount (metatiles)">
            <button type="button" class="nudge-arrow nudge-right" data-dir="right" title="Nudge right">&#x25B6;</button>
            <button type="button" class="nudge-arrow nudge-down" data-dir="down" title="Nudge down">&#x25BC;</button>
          </div>
          <label class="nudge-wrap-label"><input type="checkbox" id="nudge-wrap" checked> Wrap</label>
        </div>
      </span>
      <button id="btn-export-image" class="mode-btn" title="Export map image (PNG, visible layers as shown)" disabled><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="2" width="12" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="4.5" cy="5.5" r="1.2" fill="currentColor"/><path d="M1.5 11l3.5-3.5 2.5 2.5 2-2 3 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="toolbar-group">
      <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>&#x21B6;</button>
      <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>&#x21B7;</button>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-group">
      <a href="https://github.com/Azarem/gaia-mapper" target="_blank" rel="noopener" class="toolbar-link" title="Documentation on GitHub">Docs</a>
    </div>
  </header>

  <main id="editor-layout">
    <aside id="panel-left">
      <section id="tileset-picker-panel" class="panel">
        <h3>Tileset</h3>
        <canvas id="tileset-picker-canvas"></canvas>
      </section>
    </aside>

    <section id="panel-main">
      <canvas id="main-canvas"></canvas>
    </section>

    <aside id="panel-right">
      <section id="gfx-panel" class="panel">
        <h3>VRAM Tiles</h3>
        <canvas id="gfx-canvas"></canvas>
      </section>
      <section id="palette-panel" class="panel">
        <h3>Palette</h3>
        <canvas id="palette-canvas"></canvas>
      </section>
      <section id="properties-panel" class="panel">
        <h3>Properties</h3>
        <div id="prop-controls">
          <label title="Alt+H"><input type="checkbox" id="prop-hflip"> <u>H</u>-Flip</label>
          <label title="Alt+V"><input type="checkbox" id="prop-vflip"> <u>V</u>-Flip</label>
          <label title="Alt+P"><input type="checkbox" id="prop-priority"> <u>P</u>riority</label>
          <label title="Alt+B"><input type="checkbox" id="prop-block"> <u>B</u>lock</label>
          <div class="prop-row">
            <span>Tile: </span><span id="prop-tile-index">--</span>
          </div>
          <div class="prop-row">
            <span>Palette: </span><span id="prop-palette-index">--</span>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <footer id="status-bar">
    <span id="status-coords">--</span>
    <span id="status-info">Ready</span>
  </footer>

  <input type="file" id="file-import" accept="*" style="display:none">

  <script src="dist/app.iife.js"></script>
</body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Ensure payload.zip
        run: |
          if [ -f payload.zip ]; then
            echo "payload.zip found in repository"
          else
            echo "payload.zip not in repo, fetching from live site..."
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/payload.zip"
            echo "Trying: $PAGES_URL"
            if curl -fsSL --retry 3 -o payload.zip "$PAGES_URL"; then
              echo "Downloaded payload.zip from live site ($(wc -c < payload.zip) bytes)"
            else
              echo "::warning::payload.zip not available from live site — deploy will proceed without payload data. Generate it locally with 'npm run payload' and commit it for the initial deploy."
              rm -f payload.zip
            fi
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html styles.css _site/
          cp -r dist _site/dist
          if [ -f payload.zip ]; then
            cp payload.zip _site/
            echo "Site includes payload.zip"
          fi
          echo "Site contents:"
          ls -lhR _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
